; BloodstoneCN M2F1 + T3 R10.4 W1.2b 中文覆盖回滚与性能安全
; 本工程只负责技术层面的中文接入、覆盖和显示链路；不评价或修改翻译质量。
; 所有最终中文正文仍唯一来自 BSCNContents\loc 下现有 86 个 LOC。
; NPC 字幕已从 BloodstoneCN 主插件完全拆分，后续由独立 NPCSubtitles.asi 负责。

[General]
Enable=1
EnableNativeGlyph=1
RequireAtlas=1
Logging=1
AtlasFile=BSCNContents\fonts.bfa

[ExternalLoc]
Enable=1
Root=BSCNContents\loc
Language=en
RequireIndex=1
Index=BSCNContents\loc_context.bli

[TextCoverage]
Enable=1
LogMisses=0
LogActionTokens=0

; R10 已移除 R7.2 的 ProtectShortCodes 特判。
; GetText 使用 SOURCE_FIRST_HASH_SECOND：原游戏 source 先确定文本身份，
; primary/secondary hash 只能在同 source 记录族内部消歧。

[HudLifecycle]
; 纯动态标量（弹药/计数器/百分比等）永远保留游戏原始可变指针，
; 不进入 LOC/TextCoverage/process-lifetime stable buffer。
BypassDynamicScalars=1

; 仅当 SOURCE_FIRST 已确认 native source，而当前 runtime primary/secondary hash
; 又明确不属于所选 BLI record 时，对“自然语言 + 技术身份 token”的标签
; （例如描述词 + P99/A.R. 形态）保留 GetText 游戏原指针，并在 SubmitText
; 用同一精确 mapping 注入现有 LOC 中文。不是枪械名单，不改变候选选择。
DeferTechnicalIdentityLabels=1

; 只记录身份/动态 HUD 对象与指针变化；不改变游戏内容。
LifecycleProbe=0

; W1.2b：运行时文本语义完整回退到 W1.1；仅关闭高频诊断。
; 禁止使用 W1.2/W1.2a 的 authoritative pointer fastpath / coverage cache / sparse mixed guard。
